<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "dark") {
            document.documentElement.classList.add("dark");
        }
    </script>

    <link rel="stylesheet" href="styles.css">

    <title>Contact | Sitra</title>
</head>

<body class="bg-white text-gray-900 dark:bg-zinc-950 dark:text-white transition-colors duration-300">

    <!-- Navigation -->
    <header class="sticky top-0 z-50 border-b border-gray-200 bg-white/90 backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/90">

        <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">

            <a
                href="index.html"
                class="text-xl font-bold text-brand-600 dark:text-brand-500"
            >
                Sitra
            </a>

            <div class="flex items-center gap-4">

                <a
                    href="index.html"
                    class="text-sm font-medium hover:text-brand-600"
                >
                    Home
                </a>

                <a
                    href="projects.html"
                    class="text-sm font-medium hover:text-brand-600"
                >
                    Projects
                </a>

                <a
                    href="contact.html"
                    class="text-sm font-medium text-brand-600"
                >
                    Contact
                </a>

                <button
                    id="theme-toggle"
                    type="button"
                    aria-label="Toggle dark mode"
                    class="rounded-lg border border-gray-300 px-3 py-2 transition hover:bg-gray-100 dark:border-zinc-700 dark:hover:bg-zinc-800"
                >
                    <span id="theme-icon">🌙</span>
                </button>

            </div>

        </nav>

    </header>


    <main>

        <!-- Contact -->
        <section class="mx-auto max-w-6xl px-6 py-20">

            <p class="font-medium text-brand-600 dark:text-brand-500">
                Let's Connect
            </p>

            <h1 class="mt-3 text-section font-bold">
                Contact Me
            </h1>

            <p class="mt-5 max-w-2xl text-body leading-relaxed text-gray-600 dark:text-gray-300">
                Have a project, collaboration or opportunity?
                Feel free to get in touch.
            </p>


            <div class="mt-12 grid gap-8 md:grid-cols-2">


                <!-- Contact Information -->
                <div>

                    <h2 class="text-2xl font-bold">
                        Get in touch
                    </h2>

                    <div class="mt-6 space-y-5">

                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">
                                Email
                            </p>

                            <a
                                href="mailto:Seyfusitra@gmail.com"
                                class="mt-1 inline-block font-medium text-brand-600 hover:underline dark:text-brand-500"
                            >
                                Seyfusitra@gmail.com
                            </a>
                        </div>


                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">
                                GitHub
                            </p>

                            <a
                                href="https://github.com/sitrannm"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="mt-1 inline-block font-medium text-brand-600 hover:underline dark:text-brand-500"
                            >
                                github.com/sitrannm
                            </a>
                        </div>


                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">
                                LinkedIn
                            </p>

                            <a
                                href="https://www.linkedin.com/in/sitra-seyfu-a727b3324/"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="mt-1 inline-block font-medium text-brand-600 hover:underline dark:text-brand-500"
                            >
                                LinkedIn Profile
                            </a>
                        </div>

                    </div>

                </div>


                <!-- Message -->
                <div class="rounded-2xl border border-gray-200 p-6 dark:border-zinc-800">

                    <h2 class="text-2xl font-bold">
                        Send a message
                    </h2>

                    <form class="mt-6 space-y-5">

                        <div>

                            <label
                                for="name"
                                class="mb-2 block text-sm font-medium"
                            >
                                Name
                            </label>

                            <input
                                id="name"
                                type="text"
                                placeholder="Your name"
                                class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 outline-none transition focus:border-brand-600 dark:border-zinc-700 dark:bg-zinc-900"
                            >

                        </div>


                        <div>

                            <label
                                for="email"
                                class="mb-2 block text-sm font-medium"
                            >
                                Email
                            </label>

                            <input
                                id="email"
                                type="email"
                                placeholder="your@email.com"
                                class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 outline-none transition focus:border-brand-600 dark:border-zinc-700 dark:bg-zinc-900"
                            >

                        </div>


                        <div>

                            <label
                                for="message"
                                class="mb-2 block text-sm font-medium"
                            >
                                Message
                            </label>

                            <textarea
                                id="message"
                                rows="5"
                                placeholder="Write your message..."
                                class="w-full resize-none rounded-xl border border-gray-300 bg-white px-4 py-3 outline-none transition focus:border-brand-600 dark:border-zinc-700 dark:bg-zinc-900"
                            ></textarea>

                        </div>


                        <button
                            type="submit"
                            class="w-full rounded-xl bg-brand-600 px-6 py-3 font-semibold text-white transition hover:bg-brand-700"
                        >
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="border-t border-gray-200 dark:border-zinc-800">

        <div class="mx-auto max-w-6xl px-6 py-8 text-center">

            <p class="text-sm text-gray-500 dark:text-gray-400">
                © 2026 Sitra. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- Dark Mode -->
    <script>
        const button = document.getElementById("theme-toggle");
        const icon = document.getElementById("theme-icon");
        const html = document.documentElement;

        function updateThemeIcon() {
            icon.textContent = html.classList.contains("dark")
                ? "☀️"
                : "🌙";
        }

        updateThemeIcon();

        button.addEventListener("click", () => {

            html.classList.toggle("dark");

            const theme = html.classList.contains("dark")
                ? "dark"
                : "light";

            localStorage.setItem("theme", theme);

            updateThemeIcon();
        });
    </script>

</body>
</html>
